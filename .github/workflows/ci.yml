name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Create dummy local test configuration
        run: cp .env.example backend/.env
      - name: Build test stack
        run: docker compose up --build -d db backend
      - name: Backend health check
        run: curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://localhost:8001/health
      - name: Unit tests
        run: docker compose exec -T backend pytest -q
      - name: Stop test stack
        if: always()
        run: docker compose down
