name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Create dummy local test configuration
        run: |
          cat > backend/.env <<'EOF'
          POSTGRES_USER=peer
          POSTGRES_PASSWORD=peer
          POSTGRES_DB=peer
          SECRET_KEY=ci-only-dummy-secret-not-for-deployment
          EOF
      - name: Build test stack
        run: docker compose up --build -d db backend
      - name: Backend health check
        run: curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://localhost:8001/health
      - name: Unit tests
        run: docker compose exec -T backend pytest -q
      - name: Show backend logs on failure
        if: failure()
        run: docker compose logs --no-color backend
      - name: Stop test stack
        if: always()
        run: docker compose down
