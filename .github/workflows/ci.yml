name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Create dummy local test configuration
        run: |
          cat > backend/.env <<'EOF'
          POSTGRES_USER=peer
          POSTGRES_PASSWORD=peer
          POSTGRES_DB=peer
          SECRET_KEY=ci-only-dummy-secret-not-for-deployment
          EOF
      - name: Build test stack
        run: docker compose up --build -d db backend
      - name: Backend health check
        run: curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://localhost:8001/health
      - name: Unit tests
        run: docker compose exec -T backend pytest -q
      - name: Show backend logs on failure
        if: failure()
        run: docker compose logs --no-color backend
      - name: Stop test stack
        if: always()
        run: docker compose down
